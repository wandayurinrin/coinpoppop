<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>探金小秘書</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas (用於將彈出視窗匯出成圖片) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // ==========================================
        // 🔑 API 相關設定（直接寫死確保 App 內部可正常讀取）
        // ==========================================
        const apiKey = "AQ.Ab8RN6IMdhfb8qKSu32xbAp2VpyGqm0Op7RfAE8KJu2bcslkgQ"; 
        const GOOGLE_CLIENT_ID = "";
        // ==========================================

        const INITIAL_SETTINGS = {
          fixedPersonnel: [
            { name: '帥志', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿童', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿和', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿翔', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿孝', fullDayRate: 2500, halfDayRate: 1300 }
          ],
          companyName: '',
          taxId: '',
          phone: ''
        };

        const getDefaultBillingDate = (yearMonthStr) => {
          if (!yearMonthStr) return new Date().toISOString().split('T')[0];
          const [y, m] = yearMonthStr.split('-');
          let nextYear = parseInt(y, 10);
          let nextMonth = parseInt(m, 10) + 1;
          if (nextMonth > 12) {
            nextMonth = 1;
            nextYear += 1;
          }
          const mStr = String(nextMonth).padStart(2, '0');
          return `${nextYear}-${mStr}-05`;
        };

        const emptyRecordForm = () => {
          const defaultMonth = new Date().toISOString().slice(0, 7);
          return {
            id: null,
            type: 'contract', 
            projectName: '',
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '17:00',
            location: '',
            client: '',
            personnel: [],
            tasks: [],
            customItems: [], 
            manualBilling: '',
            billingDate: getDefaultBillingDate(defaultMonth),
            collectionDate: '',
            isCollected: false,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0 },
              food: { cost: 0, billable: false, billingAmount: 0 },
              other: { cost: 0, billable: false, billingAmount: 0 }
            },
            remarks: ''
          };
        };

        const sanitizeRecord = (record) => {
          if (!record) return emptyRecordForm();
          return {
            ...emptyRecordForm(),
            ...record,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.fuel || {}) },
              food: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.food || {}) },
              other: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.other || {}) }
            },
            personnel: Array.isArray(record.personnel) ? record.personnel : [],
            tasks: Array.isArray(record.tasks) ? record.tasks : [],
            customItems: Array.isArray(record.customItems) ? record.customItems : []
          };
        };

        const TIME_OPTIONS = [];
        for (let h = 0; h < 24; h++) {
          const hourStr = String(h).padStart(2, '0');
          TIME_OPTIONS.push(`${hourStr}:00`);
          TIME_OPTIONS.push(`${hourStr}:30`);
        }

        const callGeminiAPI = async (text) => {
          if (!apiKey) {
            throw new Error("請先填入有效的 API 金鑰");
          }

          const systemPrompt = "你是一個專業的工程紀錄助理。請從以下工程日誌中提取資訊，並回傳格式嚴謹的 JSON 物件。時間請一律轉換為 24 小時制（HH:mm格式）。";
          const userQuery = `
            日誌內容：
            ${text}

            JSON 結構必須完全符合以下格式，若未提及的數字請填 0，字串請留空：
            {
              "type": "contract",
              "projectName": "工程名稱",
              "date": "YYYY-MM-DD",
              "startTime": "HH:MM",
              "endTime": "HH:MM",
              "location": "地點",
              "client": "請款對象/客戶",
              "personnel": [
                { "name": "人名", "dayType": "full" 或 "half", "dailyRate": 數字, "overtimePay": 數字, "bonus": 數字, "billable": false }
              ],
              "tasks": [
                { "description": "工作項目描述", "laborCost": 數字, "materialCost": 數字, "billingAmount": 數字, "billable": false }
              ],
              "customItems": [
                { "name": "物品名稱", "qty": 數字, "price": 數字, "billable": false }
              ],
              "costs": {
                "fuel": { "cost": 數字, "billable": false, "billingAmount": 數字 },
                "food": { "cost": 數字, "billable": false, "billingAmount": 數字 },
                "other": { "cost": 數字, "billable": false, "billingAmount": 數字 }
              },
              "remarks": "備註內容"
            }
            請只回傳合法的 JSON 字串。
          `;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
          
          let response;
          for (let attempt = 0; attempt < 5; attempt++) {
            response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });
            if (response.ok) break;
            await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
          }

          if (!response || !response.ok) {
            throw new Error('API 請求失敗，請檢查金鑰或網路連線');
          }

          const data = await response.json();
          let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!resultText) throw new Error('AI 未回傳任何內容');

          resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
          return JSON.parse(resultText);
        };

        // ==========================================
        // 🖼️ 輸出成圖片共用功能
        // ==========================================
        const exportElementAsImage = async (elementId, filename) => {
          const element = document.getElementById(elementId);
          if (!element) return;
          try {
            const canvas = await html2canvas(element, { 
              scale: 2, 
              useCORS: true, 
              backgroundColor: '#ffffff'
            });
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
          } catch (error) {
            console.error("圖片輸出失敗", error);
            alert("圖片輸出失敗，請重試");
          }
        };

        function App() {
          const [activeTab, setActiveTab] = useState('input');
          const [editingRecord, setEditingRecord] = useState(null);
          
          const [records, setRecords] = useState(() => {
            const saved = localStorage.getItem('engineering_records');
            return saved ? JSON.parse(saved) : [];
          });

          const [settings, setSettings] = useState(() => {
            const saved = localStorage.getItem('engineering_settings');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed.fixedPersonnel && typeof parsed.fixedPersonnel[0] === 'string') {
                parsed.fixedPersonnel = parsed.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
              }
              return { ...INITIAL_SETTINGS, ...parsed };
            }
            return INITIAL_SETTINGS;
          });
          
          const [toastMessage, setToastMessage] = useState('');
          const [deleteTarget, setDeleteTarget] = useState(null);
          const [officialInvoiceModal, setOfficialInvoiceModal] = useState(null);
          const [officialSalaryModal, setOfficialSalaryModal] = useState(null);
          const [officialQuotationModal, setOfficialQuotationModal] = useState(null);

          useEffect(() => {
            localStorage.setItem('engineering_records', JSON.stringify(records));
          }, [records]);

          useEffect(() => {
            localStorage.setItem('engineering_settings', JSON.stringify(settings));
          }, [settings]);

          const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => setToastMessage(''), 3000);
          };

          const handleSaveRecord = (recordData) => {
            if (recordData.id) {
              setRecords(prev => prev.map(r => r.id === recordData.id ? recordData : r));
              showToast('紀錄已更新！');
            } else {
              const newRecord = { ...recordData, id: generateId() };
              setRecords(prev => [newRecord, ...prev]);
              showToast('紀錄已儲存！');
            }
            setEditingRecord(null);
            setActiveTab(recordData.type === 'quotation' ? 'quotation' : 'monthly');
          };

          const handleStartEdit = (record) => {
            setEditingRecord(record);
            setActiveTab('input');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const confirmDeleteRecord = () => {
            if (!deleteTarget) return;
            setRecords(prev => prev.filter(r => r.id !== deleteTarget));
            setToastMessage('紀錄已刪除');
            setDeleteTarget(null);
          };

          const updateSettings = (newSettings) => {
            setSettings(newSettings);
            showToast('設定已更新！');
          };

          const handleUpdateRecord = (updated) => {
            setRecords(prev => prev.map(r => r.id === updated.id ? updated : r));
          };

          return (
            <div className="min-h-screen bg-slate-100 text-slate-800 font-sans relative pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-10">
              {toastMessage && (
                <div className="fixed top-[calc(4rem+env(safe-area-inset-top))] right-4 bg-slate-900 text-white px-3.5 py-2 rounded-lg shadow-lg z-50 text-xs font-medium">
                  {toastMessage}
                </div>
              )}

              {deleteTarget && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-3xs flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-xl shadow-lg p-5 w-full max-w-xs border border-slate-200">
                    <h3 className="text-base font-bold text-slate-900 mb-1">確定要刪除？</h3>
                    <p className="text-xs text-slate-500 mb-4">此動作無法還原。</p>
                    <div className="flex justify-end gap-2">
                      <button onClick={() => setDeleteTarget(null)} className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium cursor-pointer">取消</button>
                      <button onClick={confirmDeleteRecord} className="px-3 py-1.5 text-xs bg-rose-600 text-white hover:bg-rose-700 rounded-lg font-medium cursor-pointer">確定刪除</button>
                    </div>
                  </div>
                </div>
              )}

              {/* 📱 產生正式請款單彈出視窗 */}
              {officialInvoiceModal && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex justify-center items-start z-50 p-2 sm:p-4 pt-14 sm:pt-16 overflow-y-auto">
                  <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col border border-slate-200 overflow-hidden mb-6 h-fit shrink-0">
                    <div className="flex justify-between items-center px-3 py-2 bg-slate-900 text-white shrink-0 sticky top-0 z-10">
                      <h3 className="font-bold text-[11px] sm:text-xs">請款單</h3>
                      <button onClick={() => setOfficialInvoiceModal(null)} className="text-slate-300 hover:text-white font-bold px-2 py-1 cursor-pointer">✕</button>
                    </div>

                    <div id="invoice-capture-area" className="p-3 bg-white text-slate-800 space-y-2 text-[10px]">
                      <div className="text-center pb-2 border-b-2 border-slate-900">
                        <h2 className="text-base font-black text-slate-900 tracking-wider mb-0.5">{settings.companyName || '工程行'}</h2>
                        <div className="text-[9px] text-slate-600 font-medium space-x-2">
                          {settings.taxId && <span>統一編號：{settings.taxId}</span>}
                          {settings.phone && <span>電話：{settings.phone}</span>}
                        </div>
                        <h1 className="text-sm font-bold text-blue-700 mt-1.5 tracking-widest uppercase">請 款 單</h1>
                      </div>

                      <div className="flex justify-between items-start bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <div className="space-y-0.5">
                          <p><strong className="text-slate-500">客戶抬頭：</strong> <span className="font-bold text-slate-900 text-[11px]">{officialInvoiceModal.client}</span></p>
                          <p><strong className="text-slate-500">請款月份：</strong> <span className="font-mono font-bold text-slate-700">{officialInvoiceModal.month}</span></p>
                        </div>
                        <div className="text-right space-y-0.5">
                          <p><strong className="text-slate-500">填表日期：</strong> <span className="font-mono">{new Date().toISOString().slice(0, 10)}</span></p>
                          <p><strong className="text-slate-500">狀態：</strong> <span className={`px-1.5 py-0.5 rounded font-bold ${officialInvoiceModal.isCollected ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>{officialInvoiceModal.isCollected ? '已收款' : '未收款'}</span></p>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-center">
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">工費總計</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalLabor.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">料錢總計</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalMaterial.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">各項費用</span><span className="font-extrabold text-slate-800">${officialInvoiceModal.totalExpenses.toLocaleString()}</span></div>
                        <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200"><span className="text-[9px] text-slate-400 block font-bold">小計金額</span><span className="font-extrabold text-blue-600">${officialInvoiceModal.grandTotal.toLocaleString()}</span></div>
                      </div>

                      <div className="space-y-1">
                        <h4 className="font-bold text-slate-700 uppercase tracking-wider text-[10px]">工程明細列表</h4>
                        <div className="border border-slate-200 rounded-lg overflow-hidden">
                          <table className="w-full text-left border-collapse text-[8px] sm:text-[9px] table-fixed">
                            <thead>
                              <tr className="bg-slate-900 text-white font-bold">
                                <th className="px-1 py-1 w-[22%]">日期</th>
                                <th className="px-1 py-1 w-[28%]">工程/摘要</th>
                                <th className="px-1 py-1 text-center w-[10%]">人數</th>
                                <th className="px-1 py-1 text-right w-[13%]">工錢</th>
                                <th className="px-1 py-1 text-right w-[13%]">其他費</th>
                                <th className="px-1 py-1 text-right w-[14%]">總額</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {officialInvoiceModal.records.map((r, idx) => {
                                const pCount = (r.personnel || []).length;
                                let labor = 0;
                                (r.personnel || []).forEach(p => { labor += (Number(p.dailyRate)||0) + (Number(p.overtimePay)||0) + (Number(p.bonus)||0); });
                                (r.tasks || []).forEach(t => { labor += Number(t.laborCost)||0; });

                                let exp = 0;
                                ['fuel', 'food', 'other'].forEach(k => { exp += Number(r.costs?.[k]?.cost) || 0; });

                                const desc = r.tasks?.[0]?.description || r.remarks || officialInvoiceModal.projectName;

                                return (
                                  <tr key={idx} className="hover:bg-slate-50 whitespace-nowrap">
                                    <td className="px-1 py-1 font-mono text-slate-500 truncate">{r.date}</td>
                                    <td className="px-1 py-1 font-bold text-slate-900 truncate" title={desc}>{desc}</td>
                                    <td className="px-1 py-1 text-center truncate">{pCount}</td>
                                    <td className="px-1 py-1 text-right truncate">${labor.toLocaleString()}</td>
                                    <td className="px-1 py-1 text-right truncate">${exp.toLocaleString()}</td>
                                    <td className="px-1 py-1 text-right font-extrabold text-blue-600 truncate">${(r.summary?.totalBilling || 0).toLocaleString()}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {(() => {
                        const materials = [];
                        officialInvoiceModal.records.forEach(r => {
                          (r.customItems || []).forEach(c => {
                            materials.push({ date: r.date, name: c.name, price: (Number(c.qty)||0) * (Number(c.price)||0) });
                          });
                        });
                        if (materials.length === 0) return null;
                        return (
                          <div className="space-y-1 mt-2">
                            <h4 className="font-bold text-slate-700 uppercase tracking-wider text-[10px]">材料購買明細</h4>
                            <div className="border border-slate-200 rounded-lg overflow-hidden">
                              <table className="w-full text-left border-collapse text-[8px] sm:text-[9px] table-fixed">
                                <thead>
                                  <tr className="bg-slate-900 text-white font-bold">
                                    <th className="px-1.5 py-1 w-[25%]">日期</th>
                                    <th className="px-1.5 py-1 w-[55%]">材料名稱</th>
                                    <th className="px-1.5 py-1 text-right w-[20%]">價格</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {materials.map((m, idx) => (
                                    <tr key={idx} className="hover:bg-slate-50 whitespace-nowrap">
                                      <td className="px-1.5 py-1 font-mono text-slate-500 truncate">{m.date}</td>
                                      <td className="px-1.5 py-1 font-bold text-slate-900 truncate">{m.name}</td>
                                      <td className="px-1.5 py-1 text-right font-bold text-slate-900 truncate">${m.price.toLocaleString()}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        );
                      })()}

                      <div className="bg-slate-900 text-white p-2.5 rounded-lg flex justify-between items-center gap-1 mt-1">
                        <span className="text-[11px] font-medium">總計請款金額</span>
                        <span className="text-lg font-black text-emerald-400">${officialInvoiceModal.grandTotal.toLocaleString()} 元整</span>
                      </div>
                    </div>

                    <div className="p-2 bg-slate-50 border-t border-slate-200 flex flex-wrap gap-2 shrink-0">
                      <button 
                        onClick={() => exportElementAsImage('invoice-capture-area', `請款單_${officialInvoiceModal.client}_${officialInvoiceModal.month}.png`)}
                        className="flex-1 min-w-[100px] bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 rounded-lg text-xs font-bold cursor-pointer shadow-sm"
                      >
                        🖼️ 儲存圖片
                      </button>
                      <button 
                        onClick={() => {
                          let text = `【 ${settings.companyName || '工程行'} 請款單 】\n`;
                          if (settings.taxId) text += `統編：${settings.taxId} | 電話：${settings.phone}\n`;
                          text += `客戶抬頭：${officialInvoiceModal.client}\n`;
                          text += `請款月份：${officialInvoiceModal.month}\n`;
                          text += `----------------------------------------\n`;
                          text += `• 工費總計：$${officialInvoiceModal.totalLabor.toLocaleString()}\n`;
                          text += `• 料錢總計：$${officialInvoiceModal.totalMaterial.toLocaleString()}\n`;
                          text += `• 其他費用：$${officialInvoiceModal.totalExpenses.toLocaleString()}\n`;
                          text += `----------------------------------------\n`;
                          text += `💰 總計請款金額：$${officialInvoiceModal.grandTotal.toLocaleString()} 元\n`;
                          navigator.clipboard.writeText(text);
                          showToast('已成功複製請款單文字！可直接貼到 LINE 傳給客戶');
                        }}
                        className="flex-1 min-w-[100px] bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-xs font-bold cursor-pointer shadow-sm"
                      >
                        📋 複製文字
                      </button>
                      <button onClick={() => setOfficialInvoiceModal(null)} className="w-full sm:w-auto px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">
                        關閉
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 📱 產生正式薪資單彈出視窗 */}
              {officialSalaryModal && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex justify-center items-start z-50 p-2 sm:p-4 pt-14 sm:pt-16 overflow-y-auto">
                  <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col border border-slate-200 overflow-hidden mb-6 h-fit shrink-0">
                    <div className="flex justify-between items-center px-3 py-2 bg-slate-900 text-white shrink-0 sticky top-0 z-10">
                      <h3 className="font-bold text-[11px] sm:text-xs">薪資結算單</h3>
                      <button onClick={() => setOfficialSalaryModal(null)} className="text-slate-300 hover:text-white font-bold px-2 py-1 cursor-pointer">✕</button>
                    </div>

                    <div id="salary-capture-area" className="p-3 bg-white text-slate-800 text-[10px]">
                      {officialSalaryModal.map((salaryInfo, index) => (
                        <div key={index} className={index > 0 ? "mt-6 pt-6 border-t-2 border-dashed border-slate-300 space-y-2" : "space-y-2"}>
                          <div className="text-center pb-2 border-b-2 border-slate-900">
                            <h2 className="text-base font-black text-slate-900 tracking-wider mb-0.5">{settings.companyName || '工程行'}</h2>
                            <h1 className="text-sm font-bold text-emerald-700 mt-1.5 tracking-widest uppercase">薪 資 結 算 單</h1>
                          </div>

                          <div className="flex justify-between items-start bg-slate-50 p-2 rounded-lg border border-slate-200">
                            <div className="space-y-0.5">

        function InputView({ onSave, settings, initialData, onCancelEdit }) {
          const [formData, setFormData] = useState(() => sanitizeRecord(initialData));
          const [aiText, setAiText] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);
          const [aiError, setAiError] = useState('');

          useEffect(() => {
            setFormData(sanitizeRecord(initialData));
          }, [initialData]);

          const handleAIFill = async () => {
            if (!aiText.trim()) return;
            setIsAiLoading(true);
            setAiError('');
            try {
              const result = await callGeminiAPI(aiText);
              setFormData(prev => ({
                ...prev,
                ...result,
                personnel: (result.personnel || []).map(p => ({ 
                  ...p, 
                  id: generateId(), 
                  isFixed: settings.fixedPersonnel.some(fp => fp.name === p.name) || p.isFixed,
                  dayType: p.dayType || 'full',
                  dailyRate: p.dailyRate || 2500,
                  billable: false 
                })),
                tasks: (result.tasks || []).map(t => ({ 
                  ...t, 
                  id: generateId(),
                  billable: false 
                })),
                customItems: (result.customItems || []).map(c => ({ 
                  ...c, 
                  id: generateId(),
                  billable: false 
                })),
                costs: {
                  fuel: { cost: result.costs?.fuel?.cost || 0, billable: false, billingAmount: result.costs?.fuel?.billingAmount || 0 },
                  food: { cost: result.costs?.food?.cost || 0, billable: false, billingAmount: result.costs?.food?.billingAmount || 0 },
                  other: { cost: result.costs?.other?.cost || 0, billable: false, billingAmount: result.costs?.other?.billingAmount || 0 }
                }
              }));
            } catch (error) {
              setAiError(error.message || 'AI 解析失敗');
            } finally {
              setIsAiLoading(false);
            }
          };

          const handleInputChange = (field, value) => {
            setFormData(prev => {
              const updated = { ...prev, [field]: value };
              if (field === 'date' && value) {
                const ym = value.slice(0, 7);
                updated.billingDate = getDefaultBillingDate(ym);
              }
              return updated;
            });
          };
          
          const handleCostDetailChange = (costKey, field, value) => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                [costKey]: {
                  ...prev.costs[costKey],
                  [field]: field === 'billable' ? value : (Number(value) || 0)
                }
              }
            }));
          };

          const addFixedPersonnel = (fp) => {
            const isAlreadyAdded = formData.personnel.some(p => p.name === fp.name);
            if (isAlreadyAdded) {
              setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.name !== fp.name) }));
            } else {
              setFormData(prev => ({ 
                ...prev, 
                personnel: [...prev.personnel, { id: generateId(), name: fp.name, isFixed: true, dayType: 'full', dailyRate: fp.fullDayRate || 2500, overtimePay: 0, bonus: 0, billable: false }] 
              }));
            }
          };

          const addPersonnel = (isFixed, name = '') => setFormData(prev => ({ 
            ...prev, 
            personnel: [...prev.personnel, { id: generateId(), name, isFixed, dayType: 'full', dailyRate: 2500, overtimePay: 0, bonus: 0, billable: false }] 
          }));

          const updatePersonnel = (id, field, value) => {
            setFormData(prev => ({ 
              ...prev, 
              personnel: prev.personnel.map(p => {
                if (p.id !== id) return p;
                let updated = { ...p };
                if (field === 'dayType') {
                  updated.dayType = value;
                  const matchedFp = settings.fixedPersonnel.find(fp => fp.name === p.name);
                  if (matchedFp) {
                    updated.dailyRate = value === 'full' ? matchedFp.fullDayRate : matchedFp.halfDayRate;
                  }
                } else if (field === 'name' || field === 'billable') {
                  updated[field] = value;
                } else {
                  updated[field] = Number(value) || 0;
                }
                return updated;
              }) 
            }));
          };

          const removePersonnel = (id) => setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.id !== id) }));

          const addTask = () => setFormData(prev => ({ 
            ...prev, 
            tasks: [...prev.tasks, { id: generateId(), description: '', laborCost: 0, materialCost: 0, billingAmount: 0, billable: false }] 
          }));
          const updateTask = (id, field, value) => setFormData(prev => ({ 
            ...prev, 
            tasks: prev.tasks.map(t => t.id === id ? { ...t, [field]: field === 'description' || field === 'billable' ? value : (Number(value) || 0) } : t) 
          }));
          const removeTask = (id) => setFormData(prev => ({ ...prev, tasks: prev.tasks.filter(t => t.id !== id) }));

          const addCustomItem = () => setFormData(prev => ({
            ...prev,
            customItems: [...prev.customItems, { id: generateId(), name: '', qty: 1, price: 0, billable: false }]
          }));
          const updateCustomItem = (id, field, value) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.map(c => c.id === id ? { ...c, [field]: field === 'name' || field === 'billable' ? value : (Number(value) || 0) } : c)
          }));
          const removeCustomItem = (id) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.filter(c => c.id !== id)
          }));

          const autoBillingSum = useMemo(() => {
            let sum = 0;
            formData.personnel.forEach(p => {
              if (p.billable) sum += (Number(p.dailyRate) || 0) + (Number(p.overtimePay) || 0) + (Number(p.bonus) || 0);
            });
            formData.tasks.forEach(t => { if (t.billable) sum += Number(t.billingAmount) || 0; });

        function BillingView({ records, settings, onUpdateRecord, setOfficialInvoiceModal }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedClient, setSelectedClient] = useState('全部');
          const [expandedProjects, setExpandedProjects] = useState({});

          const validRecords = useMemo(() => records.filter(r => r.type !== 'quotation'), [records]);
          
          const clients = useMemo(() => {
            const list = Array.from(new Set(validRecords.filter(r => r.date && r.date.startsWith(selectedMonth)).map(r => r.client)));
            return ['全部', ...list];
          }, [validRecords, selectedMonth]);

          useEffect(() => { 
            if (!clients.includes(selectedClient)) setSelectedClient('全部'); 
          }, [clients, selectedClient]);

          const clientRecords = useMemo(() => {
            return validRecords.filter(r => {
              if (!r.date || !r.date.startsWith(selectedMonth)) return false;
              if (selectedClient === '全部') return true;
              return r.client === selectedClient;
            });
          }, [validRecords, selectedMonth, selectedClient]);
          
          const groupedByProject = useMemo(() => {
            const map = {};
            clientRecords.forEach(r => {
              const pName = r.projectName || '未命名工程';
              const clientKey = selectedClient === '全部' ? `[${r.client || '散客'}] ${pName}` : pName;
              
              if (!map[clientKey]) {
                map[clientKey] = {
                  projectName: pName,
                  client: r.client || '散客',
                  records: [],
                  totalLabor: 0,
                  totalMaterial: 0,
                  totalExpenses: 0,
                  grandTotalBilling: 0,
                  isCollected: r.isCollected
                };
              }
              map[clientKey].records.push(r);
              
              let labor = 0;
              (r.personnel || []).forEach(p => { labor += (Number(p.dailyRate) || 0) + (Number(p.overtimePay) || 0) + (Number(p.bonus) || 0); });
              (r.tasks || []).forEach(t => { labor += Number(t.laborCost) || 0; });
              map[clientKey].totalLabor += labor;

              let material = 0;
              (r.tasks || []).forEach(t => { material += Number(t.materialCost) || 0; });
              (r.customItems || []).forEach(c => { material += (Number(c.qty) || 0) * (Number(c.price) || 0); });
              map[clientKey].totalMaterial += material;

              let exp = 0;
              ['fuel', 'food', 'other'].forEach(k => {
                exp += Number(r.costs?.[k]?.cost) || 0;
              });
              map[clientKey].totalExpenses += exp;

              map[clientKey].grandTotalBilling += r.summary?.totalBilling || 0;
            });
            return Object.values(map);
          }, [clientRecords, selectedClient]);

          const overallGrandTotal = groupedByProject.reduce((sum, item) => sum + item.grandTotalBilling, 0);

          const toggleExpand = (key) => {
            setExpandedProjects(prev => ({ ...prev, [key]: !prev[key] }));

            e.stopPropagation();

            proj.records.forEach(r => {

              onUpdateRecord(updated);

                        (r.tasks || []).forEach(t => { l += Number(t.laborCost)||0; });

                        (r.tasks || []).forEach(t => { m += Number(t.materialCost)||0; });

                  </div>

                  <div className="space-y-3">
                    <h3 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider print:hidden">請款專案一覽表 (點擊展開詳細明細)</h3>
                    
                    {groupedByProject.map((proj, pIdx) => {
                      const isExpanded = expandedProjects[pIdx];
                      return (
                        <div key={pIdx} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/40 transition-all">

                          >
                            <div className="flex items-center gap-2.5 min-w-0 flex-1">
                              <span className={`w-6 h-6 shrink-0 rounded-lg flex items-center justify-center font-bold text-[11px] ${isExpanded ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'} print:hidden`}>
                                {isExpanded ? '▲' : '▼'}
                              </span>
                              <div className="min-w-0 flex-1 truncate">
                                <h4 className="font-bold text-xs sm:text-sm text-slate-900 truncate">{proj.projectName}</h4>
                                <p className="text-[10px] text-slate-500 font-medium truncate">客戶：{proj.client}</p>

                            </div>

                            <div className="flex items-center gap-3 shrink-0">

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] bg-slate-50 p-2 rounded-lg border border-slate-200/60">
                              <div><span className="text-slate-400 block font-bold text-[8px]">工費總額</span><span className="font-bold text-slate-800">${proj.totalLabor.toLocaleString()}</span></div>
                              <div><span className="text-slate-400 block font-bold text-[8px]">料總額</span><span className="font-bold text-slate-800">${proj.totalMaterial.toLocaleString()}</span></div>
                              <div><span className="text-slate-400 block font-bold text-[8px]">各項費用</span><span className="font-bold text-slate-800">${proj.totalExpenses.toLocaleString()}</span></div>
                              <div><span className="text-slate-400 block font-bold text-[8px]">總計</span><span className="font-bold text-emerald-600">${proj.grandTotalBilling.toLocaleString()}</span></div>
                            </div>

                            <div>
                              <h5 className="text-[10px] font-bold text-slate-500 mb-1 uppercase">每日工作摘要</h5>
                              <div className="border border-slate-200 rounded-lg overflow-hidden">
                                <table className="w-full text-left border-collapse text-[8px] sm:text-[9px] bg-white table-fixed">
                                  <thead>
                                    <tr className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                                      <th className="px-1.5 py-1 w-[22%]">日期</th>
                                      <th className="px-1.5 py-1 w-[28%]">工程/摘要</th>
                                      <th className="px-1.5 py-1 text-center w-[10%]">人數</th>
                                      <th className="px-1.5 py-1 text-right w-[13%]">工錢</th>
                                      <th className="px-1.5 py-1 text-right w-[13%]">其他費</th>
                                      <th className="px-1.5 py-1 text-right w-[14%]">總額</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100">
                                    {proj.records.map(r => {
                                      const pCount = (r.personnel || []).length;
                                      let laborSum = 0;
                                      (r.personnel || []).forEach(p => { laborSum += (Number(p.dailyRate) || 0) + (Number(p.overtimePay) || 0) + (Number(p.bonus) || 0); });
                                      (r.tasks || []).forEach(t => { laborSum += Number(t.laborCost) || 0; });

                                      ['fuel', 'food', 'other'].forEach(k => { expSum += Number(r.costs?.[k]?.cost) || 0; });

                                        <tr className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">

                                          <th className="px-1.5 py-1 text-right w-[20%]">價格</th>

                                      <tbody className="divide-y divide-slate-100">

                                          <tr key={idx} className="hover:bg-slate-50 whitespace-nowrap">

        function SalaryView({ records, settings, setOfficialSalaryModal }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedEmployee, setSelectedEmployee] = useState('全部');

          const allEmployeeNames = useMemo(() => {
            const setNames = new Set();
            records.forEach(r => {
              if (r.type !== 'quotation' && r.date && r.date.startsWith(selectedMonth)) {
                (r.personnel || []).forEach(p => { if (p.name) setNames.add(p.name); });
              }
            });
            return ['全部', ...Array.from(setNames)];
          }, [records, selectedMonth]);

          useEffect(() => {
            if (!allEmployeeNames.includes(selectedEmployee)) setSelectedEmployee('全部');
          }, [allEmployeeNames, selectedEmployee]);

          const salaryData = useMemo(() => {
            const monthRecords = records.filter(r => r.type !== 'quotation' && r.date && r.date.startsWith(selectedMonth));
            const employeeMap = {};

            monthRecords.forEach(r => {
              (r.personnel || []).forEach(p => {
                const name = p.name || '未具名';
                if (selectedEmployee !== '全部' && name !== selectedEmployee) return;

                if (!employeeMap[name]) {
                  employeeMap[name] = {
                    name,
                    totalDays: 0,
                    totalSalary: 0,
                    details: []
                  };
                }
                const dayValue = p.dayType === 'half' ? 0.5 : 1.0;
                const dailyPay = Number(p.dailyRate) || 0;
                const overtime = Number(p.overtimePay) || 0;
                const bonus = Number(p.bonus) || 0;
                const subTotal = dailyPay + overtime + bonus;

                employeeMap[name].totalDays += dayValue;
                employeeMap[name].totalSalary += subTotal;
                employeeMap[name].details.push({
                  date: r.date,
                  projectName: r.projectName,
                  dayType: p.dayType === 'half' ? '半日' : '全日',
                  dailyRate: dailyPay,
                  overtime,
                  bonus,
                  subTotal
                });
              });
            });

            return Object.values(employeeMap);
          }, [records, selectedMonth, selectedEmployee]);

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-2xs flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 text-xs">
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-slate-500">月份:</span>
                    <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs" />
                  </div>
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-slate-500">員工:</span>
                    <select value={selectedEmployee} onChange={e => setSelectedEmployee(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs max-w-[100px]">
                      {allEmployeeNames.map(name => <option key={name} value={name}>{name}</option>)}
                    </select>
                  </div>
                </div>
                <button 
                  onClick={() => {
                    if (salaryData.length === 0) {
                      alert('當月無薪資資料可產生');
                      return;
                    }
                    const targetData = selectedEmployee === '全部' ? salaryData : salaryData.filter(e => e.name === selectedEmployee);
                    if (targetData.length === 0) return;
                    
                    setOfficialSalaryModal(targetData.map(emp => ({
                      name: emp.name,
                      month: selectedMonth,
                      totalDays: emp.totalDays,
                      totalSalary: emp.totalSalary,
                      details: emp.details
                    })));
                  }} 
                  title="產生正式薪資單" 
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0 flex items-center gap-1.5 shadow-sm"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                  <span>產生正式薪資單</span>
                </button>
              </div>

              <div className="space-y-4">
                {salaryData.map(emp => (
                  <Card key={emp.name} title={`員工：${emp.name} (天數: ${emp.totalDays} 天 | 總薪資: $${emp.totalSalary.toLocaleString()})`}>

        function SettingsView({ settings, onSave, records, setRecords, showToast }) {
          const [form, setForm] = useState(settings);
          const [newName, setNewName] = useState('');
          const [newFullRate, setNewFullRate] = useState(2500);
          const [newHalfRate, setNewHalfRate] = useState(1300);
          const [importText, setImportText] = useState('');

          const handleFieldChange = (field, val) => setForm(prev => ({ ...prev, [field]: val }));

          const updatePersonRate = (index, field, rate) => {
            const updatedPersonnel = [...form.fixedPersonnel];
            updatedPersonnel[index] = { ...updatedPersonnel[index], [field]: Number(rate) || 0 };
            const updated = { ...form, fixedPersonnel: updatedPersonnel };
            setForm(updated);
            onSave(updated);
          };

          const addPerson = (e) => {
            e.preventDefault();
            if (!newName.trim()) return;
            const updated = { 
              ...form, 
              fixedPersonnel: [...form.fixedPersonnel, { name: newName.trim(), fullDayRate: Number(newFullRate) || 2500, halfDayRate: Number(newHalfRate) || 1300 }] 
            };
            setForm(updated);
            onSave(updated);
            setNewName('');
            setNewFullRate(2500);
            setNewHalfRate(1300);
          };

          const removePerson = (name) => {
            const updated = { ...form, fixedPersonnel: form.fixedPersonnel.filter(p => p.name !== name) };
            setForm(updated);
            onSave(updated);
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            onSave(form);
          };

          const exportDataText = () => {
            const jsonStr = JSON.stringify({ records, settings });
            navigator.clipboard.writeText(jsonStr);
            showToast('備份代碼已成功複製到剪貼簿！可貼到 LINE 或備忘錄保存');
          };

          const importDataText = () => {
            if (!importText.trim()) {
              alert('請先貼上備份代碼文字');
              return;
            }
            try {
              const parsed = JSON.parse(importText.trim());
              if (parsed.records) setRecords(parsed.records);
              if (parsed.settings) {
                if (parsed.settings.fixedPersonnel && typeof parsed.settings.fixedPersonnel[0] === 'string') {
                  parsed.settings.fixedPersonnel = parsed.settings.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
                }
                setForm(parsed.settings);
                onSave(parsed.settings);
              }
              showToast('資料還原成功！');
              setImportText('');
            } catch (err) {
              alert('備份代碼格式錯誤，請確認是否完整複製');
            }
          };

          return (
            <div className="space-y-4 max-w-2xl mx-auto">
              <Card title="公司/工作室抬頭設定 (用於請款單)">
                <form onSubmit={handleSaveSettings} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">公司名稱</label>
                      <input type="text" value={form.companyName || ''} onChange={e => handleFieldChange('companyName', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：順發工程行" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">統一編號</label>
                      <input type="text" value={form.taxId || ''} onChange={e => handleFieldChange('taxId', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：12345678" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">聯絡電話</label>
                      <input type="text" value={form.phone || ''} onChange={e => handleFieldChange('phone', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：0912-345678" />
                    </div>
                  </div>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer">儲存基本設定</button>
                </form>
              </Card>

              <Card title="固定班底與薪資管理">
                <div className="space-y-2.5 mb-4">
                  {form.fixedPersonnel.map((fp, index) => (
                    <div key={fp.name} className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs gap-3">
                      <span className="font-bold text-slate-800 text-sm">{fp.name}</span>
                      <div className="flex items-center gap-2 w-full sm:w-auto">
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[9px] text-slate-500 font-bold">全日薪</label>
                          <input 
                            type="number" 
                            value={fp.fullDayRate} 
                            onChange={(e) => updatePersonRate(index, 'fullDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[9px] text-slate-500 font-bold">半日薪</label>
                          <input 
                            type="number" 
                            value={fp.halfDayRate} 
                            onChange={(e) => updatePersonRate(index, 'halfDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <button type="button" onClick={() => removePerson(fp.name)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer" title="移除">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={addPerson} className="pt-3 border-t border-slate-200">
                  <h4 className="text-[11px] font-bold text-slate-600 uppercase mb-3">新增班底</h4>
                  <div className="flex flex-col sm:flex-row gap-2.5 mb-3">
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">姓名</label>
                      <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="姓名" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">全日薪</label>
                      <input type="number" value={newFullRate} onChange={e => setNewFullRate(e.target.value)} placeholder="2500" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">半日薪</label>
                      <input type="number" value={newHalfRate} onChange={e => setNewHalfRate(e.target.value)} placeholder="1300" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                  </div>
                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer">新增班底</button>
                </form>
              </Card>

              <Card title="手機 App 專用備份與還原">
                <div className="space-y-3">
                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    備份在手機上！
                  </p>
                  <button type="button" onClick={exportDataText} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">
                    📋 一鍵複製備份代碼
                  </button>
                  <div className="pt-2 border-t border-slate-100 space-y-2">
                    <label className="block text-[11px] font-bold text-slate-700">還原資料（請將備份代碼貼在下方）：</label>
                    <textarea 
                      rows="3" 
                      value={importText} 
                      onChange={e => setImportText(e.target.value)} 
                      placeholder="在此貼上剛剛複製的備份代碼文字..."
                      className="w-full p-2.5 text-xs border border-slate-200 rounded-xl outline-none font-mono"
                    ></textarea>
                    <button type="button" onClick={importDataText} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer">
                      📥 執行還原資料
                    </button>
                  </div>
                </div>
              </Card>
              
              {/* 新增的 App 系統與更新卡片 */}
              <Card title="系統資訊與更新">
                <div className="flex items-center justify-between p-1">
                  <div>
                    <p className="text-sm font-bold text-slate-800">探金小秘書 App</p>
                    <p className="text-[11px] font-medium text-slate-500 mt-0.5">當前版本：v1.0.1</p>
                  </div>
                  <button 
                    type="button"
                    onClick={() => {
                      if (window.confirm('⚠️ 【更新提醒】\n\n更新 App 前，請確保您已經點擊上方的「一鍵複製備份代碼」並妥善保存（貼到 LINE 或記事本），以免更新後資料遺失！\n\n確定已備份，並前往下載最新版本嗎？')) {
                        /* 🔴 請在此替換為你的 GitHub Releases 最新版網址 🔴 */
                        const githubReleaseUrl = 'https://github.com/wandayurinrin/coinpoppop/releases/latest'; 
                        window.open(githubReleaseUrl, '_blank');
                      }
                    }}
                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm inline-block cursor-pointer"
                  >
                    檢查並下載更新
                  </button>
                </div>
              </Card>

            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
